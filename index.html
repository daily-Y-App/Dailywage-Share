    <script>
        const appLink = 'https://daily-y-app.github.io/Apk-download';
        const shareTitle = 'DailyWage APK';
        const shareText = 'DailyWage APK ကို ဒီလင့်ကနေ Download လုပ်ပါ။\n' + appLink;

        async function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const helper = document.createElement('textarea');
            helper.value = text;
            helper.style.position = 'fixed';
            helper.style.opacity = '0';
            document.body.appendChild(helper);
            helper.focus();
            helper.select();
            document.execCommand('copy');
            helper.remove();
        }

        async function copyLink() {
            try {
                await copyText(appLink);
                showNotice('✅ Link copied ပါပြီ။ သူငယ်ချင်းထံ Paste လုပ်ပြီး ပို့နိုင်ပါပြီ။');
            } catch (error) {
                showNotice('Link copy မအောင်မြင်ပါ။ Link ကိုဖိထားပြီး Copy လုပ်ပါ။');
            }
        }

        async function shareLink() {
            if (navigator.share) {
                try {
                    await navigator.share({ title: shareTitle, text: shareText, url: appLink });
                } catch (error) {
                    if (error.name !== 'AbortError') showNotice('Share မအောင်မြင်ပါ။ ထပ်စမ်းကြည့်ပါ။');
                }
                return;
            }
            await copyLink();
        }

        function showNotice(message) {
            const notice = document.getElementById('notice');
            notice.textContent = message;
            notice.classList.add('show');
            setTimeout(() => notice.classList.remove('show'), 2800);
        }
    </script>
